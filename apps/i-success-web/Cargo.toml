[package]
name = "i-success-web"
description = "WebAssembly browser shell for I-SUCCESS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
i-success-ui-egui.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui.workspace = true
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["HtmlCanvasElement"] }
